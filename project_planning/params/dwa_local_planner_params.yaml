DWAPlannerROS:
  # Robot Configuration
  max_vel_x: 0.22
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.22
  min_vel_trans: 0.11
  max_vel_theta: 2.75
  min_vel_theta: 1.37
  acc_lim_x: 2.5
  acc_lim_y: 0.0
  acc_lim_th: 3.2

  # Goal Tolerance
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.1
  latch_xy_goal_tolerance: false

  # Forward Simulation
  sim_time: 2.0
  sim_granularity: 0.025
  vx_samples: 6
  vy_samples: 0
  vtheta_samples: 20

  # Trajectory Scoring
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02

  # Oscillation Prevention
  oscillation_reset_dist: 0.25
