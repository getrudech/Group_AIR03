# Robot footprint - TurtleBot3 Burger
robot_radius: 0.15

# Obstacle layer
obstacle_layer:
  enabled: true
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    topic: /scan
    data_type: LaserScan
    clearing: true
    marking: true
    inf_is_valid: true
    obstacle_range: 2.5
    raytrace_range: 3.0

# Inflation layer
inflation_layer:
  enabled: true
  inflation_radius: 0.3
  cost_scaling_factor: 3.0
