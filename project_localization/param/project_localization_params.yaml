# Particles
min_particles:     500
max_particles:     3000
resample_interval: 1
update_min_d:      0.2
update_min_a:      0.5

# Data from the laser
# laser_model_type: likelihood_field
laser_min_range:  0.15
laser_max_range:  3.5
laser_max_beams:  180
laser_z_hit:      0.95
# laser_z_rand:     0.5
laser_sigma_hit:  0.2

# Odometry
odom_model_type: diff-corrected
odom_alpha1: 0.1
odom_alpha2: 0.1
odom_alpha3: 0.1
odom_alpha4: 0.1
odom_alpha5: 0.1

# Recovery
recovery_alpha_slow: 0.00
recovery_alpha_fast: 0.0
transform_tolerance: 0.5

odom_frame_id:   odom
base_frame_id:   base_footprint
global_frame_id: map